[workspace]
members = [
  "crates/*"
]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
fastrand = "2.4.1"
memchr = "2.7"
serde_json = "1.0"
shared = {path = "crates/shared"}
urlencoding = "2.1.3"
walkdir = "2.5.0"
zbus = { version = "4.0", default-features = false, features = ["blocking", "tokio"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
